    movement: &four_way
      connectivity: 4
      diagonal_cost: 1.4142135623730951
      allow_corner_cutting: false
  - map: maps/handcrafted/narrow_channel_20.json
    movement: *four_way
  - map: maps/handcrafted/maze_30.json
    movement: *four_way
  - map: maps/handcrafted/dead_ends_30.json
    movement: *four_way
  - map: maps/handcrafted/bottleneck_50.json
    movement: *four_way
  - map: maps/handcrafted/no_path_20.json
    movement: *four_way
  - map: maps/generated/evaluation/evaluation_20x20_d10.json
    movement: *four_way
  - map: maps/generated/evaluation/evaluation_20x20_d20.json
    movement: *four_way
  - map: maps/generated/evaluation/evaluation_20x20_d30.json
    movement: *four_way
  - map: maps/generated/evaluation/evaluation_50x50_d10.json
    movement: *four_way
  - map: maps/generated/evaluation/evaluation_50x50_d20.json
    movement: *four_way
  - map: maps/generated/evaluation/evaluation_50x50_d30.json
