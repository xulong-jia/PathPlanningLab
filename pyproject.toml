[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "path-planning-lab"
version = "0.1.0"
description = "Reproducible grid path-planning algorithms and experiments"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "deap",
  "matplotlib",
  "numpy",
  "pandas",
  "PyYAML",
]

[project.optional-dependencies]
dev = [
  "mypy",
  "pytest",
  "pytest-cov",
  "ruff",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["path_planning"]

[tool.coverage.report]
precision = 2
show_missing = true

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["B", "E", "F", "I", "UP"]

[tool.mypy]
strict = true

[[tool.mypy.overrides]]
module = ["deap.*", "matplotlib.*"]
ignore_missing_imports = true
